<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>房総 通行止め自動回避ナビ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>html,body{height:100%;margin:0;font-family:Arial,"Noto Sans JP",sans-serif}.app{height:100%;display:grid;grid-template-columns:340px 1fr}.side{padding:14px;overflow:auto;border-right:1px solid #ddd;background:#fff}.map{height:100%}h1{font-size:18px;margin:0 0 6px}.sub{font-size:11px;color:#666;line-height:1.5}.section{margin-top:14px;padding-top:12px;border-top:1px solid #ddd}label{font-size:11px;font-weight:700;display:block;margin:7px 0 4px}input{box-sizing:border-box;width:100%;padding:9px;border:1px solid #ccc;border-radius:7px}button{border:0;border-radius:7px;padding:10px;font-weight:700;cursor:pointer}.primary{width:100%;margin-top:10px;background:#1769aa;color:#fff}.secondary{width:100%;background:#ece9e2}.status{margin-top:8px;padding:9px;border-radius:7px;background:#f4f6f8;font-size:12px;line-height:1.45}.ok{background:#eaf6ec}.warn{background:#fff4e5}.kpi{display:flex;gap:7px;margin:8px 0}.kpi>div{flex:1;border:1px solid #ddd;padding:7px;border-radius:8px}.kpi b{display:block;font-size:18px}.kpi span{font-size:10px;color:#666}.card{border:1px solid #ddd;border-radius:8px;padding:8px;margin:7px 0}.card strong{display:block;font-size:12px}.card small{font-size:10px;color:#666;line-height:1.4}.token{background:#fff7e6;border:1px solid #e9c46a;border-radius:9px;padding:9px;margin-top:8px}.legend{font-size:10px;color:#555;line-height:1.5;margin-top:8px}.linekey{display:inline-block;width:24px;height:6px;background:#111;border-radius:3px;margin-right:5px}.routeInfo{font-size:12px;line-height:1.5;margin-top:8px}@media(max-width:800px){.app{grid-template-columns:1fr;grid-template-rows:auto 62vh;height:auto}.map{height:62vh}}</style></head>
<body><div class="app"><aside class="side"><h1>房総 通行止め自動回避ナビ</h1><div class="sub">規制回避を最優先。高速はNEXCO「通行止め実施中」、元名127号は富津市の当日緊急情報を直接監視します。</div>
<div class="token"><b>Mapbox 公開トークン</b><input id="token" placeholder="pk. で始まる公開トークン"><button class="secondary" style="margin-top:6px" onclick="saveToken()">保存</button></div>
<div id="updateStatus" class="status">規制情報を読み込み中…</div><div class="kpi"><div><b id="generalCount">—</b><span>一般道</span></div><div><b id="highwayCount">—</b><span>高速道路</span></div><div><b id="updatedAt">—</b><span>更新</span></div></div><button class="secondary" onclick="loadClosures(true)">↻ 最新データを再読込</button>
<div class="legend"><span class="linekey"></span>通行止め区間。黒線は交通情報を使わない道路形状で描画し、閉鎖道路自体を表示します。</div>
<div class="section"><label>出発地</label><input id="start" value="木更津駅"><label>目的地</label><input id="goal" value="館山駅"><button class="primary" onclick="routeNow()">通行止めを避けてルート検索</button><div id="routeStatus" class="status">出発地と目的地を入力してください。</div><div id="routeInfo" class="routeInfo"></div></div>
<div class="section"><b>現在の通行止め</b><div id="closureList"></div></div></aside><div id="map" class="map"></div></div>
<script>
const map=L.map('map');map.fitBounds([[34.95,139.72],[35.68,140.25]],{padding:[10,10]});L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
let closures=[],regLayer=L.layerGroup().addTo(map),routeLayer=L.layerGroup().addTo(map),resolved={};const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function token(){return localStorage.getItem('boso_mapbox_token')||''}function saveToken(){const t=$('token').value.trim();if(!t.startsWith('pk.'))return alert('pk. で始まる公開トークンを貼り付けてください');localStorage.setItem('boso_mapbox_token',t);$('routeStatus').className='status ok';$('routeStatus').textContent='保存しました。';renderRegulations()}$('token').value=token();
async function loadClosures(force=false){try{const r=await fetch('closures.json'+(force?'?t='+Date.now():''),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();closures=j.closures||[];$('generalCount').textContent=j.general_count??0;$('highwayCount').textContent=j.highway_count??0;$('updatedAt').textContent=new Date(j.generated_at).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});$('updateStatus').className='status ok';$('updateStatus').textContent='現在実施中の規制データを表示しています。';renderList();await renderRegulations()}catch(e){$('updateStatus').className='status warn';$('updateStatus').textContent='規制データ取得失敗: '+e.message}}
function renderList(){const b=$('closureList');b.innerHTML='';for(const c of closures){const d=document.createElement('div');d.className='card';d.innerHTML=`<strong>${esc(c.title)}</strong><small>${esc(c.location||'')}<br>${esc(c.source_name||'')}</small>`;b.appendChild(d)}}
async function geocode(q,t){const r=await fetch('https://api.mapbox.com/search/geocode/v6/forward?'+new URLSearchParams({q,country:'jp',language:'ja',limit:'1',access_token:t}));if(!r.ok)return null;const j=await r.json();return j.features?.[0]?.geometry?.coordinates||null}
async function roadGeometry(a,b,t){const u='https://api.mapbox.com/directions/v5/mapbox/driving/'+a.join(',')+';'+b.join(',')+'?'+new URLSearchParams({access_token:t,geometries:'geojson',overview:'full',steps:'false',alternatives:'false'});const r=await fetch(u);if(!r.ok)return null;const j=await r.json();return j.routes?.[0]?.geometry?.coordinates||null}
async function closureGeometry(c,t){if(resolved[c.id])return resolved[c.id];let pts=c.fixed_points||null;if(!pts&&Array.isArray(c.endpoints)){const a=await geocode(c.endpoints[0]+' '+(c.road||'')+' 千葉県',t),b=await geocode(c.endpoints[1]+' '+(c.road||'')+' 千葉県',t);if(a&&b)pts=[a,b]}let line=null;if(pts?.length===2)line=await roadGeometry(pts[0],pts[1],t);const out={pts:pts||[],line};resolved[c.id]=out;return out}
async function renderRegulations(){regLayer.clearLayers();resolved={};const t=token();if(!t)return;for(const c of closures){const g=await closureGeometry(c,t);if(g.line?.length){L.polyline(g.line.map(p=>[p[1],p[0]]),{color:'#111',weight:c.kind==='highway'?9:8,opacity:.92}).bindPopup(`<b>${esc(c.title)}</b><br>${esc(c.location||'')}<br><small>${esc(c.source_name||'')}</small>`).addTo(regLayer)}else if(g.pts?.length){g.pts.forEach(p=>L.circleMarker([p[1],p[0]],{radius:6,color:'#111',fillColor:'#111',fillOpacity:1}).addTo(regLayer))}}}
function distPointSeg(p,a,b){const x=p[0],y=p[1],x1=a[0],y1=a[1],x2=b[0],y2=b[1];const dx=x2-x1,dy=y2-y1;let tt=((x-x1)*dx+(y-y1)*dy)/(dx*dx+dy*dy||1);tt=Math.max(0,Math.min(1,tt));const xx=x1+tt*dx,yy=y1+tt*dy;const lat=(y+yy)/2*Math.PI/180;return Math.hypot((x-xx)*111320*Math.cos(lat),(y-yy)*110540)}
function routeHits(routeCoords,geoms){for(const g of geoms){if(!g.line?.length)continue;for(let i=0;i<routeCoords.length;i+=Math.max(1,Math.floor(routeCoords.length/250))){const p=routeCoords[i];for(let j=1;j<g.line.length;j+=Math.max(1,Math.floor(g.line.length/120))){if(distPointSeg(p,g.line[j-1],g.line[j])<55)return true}}}return false}
async function routeNow(){const t=token();if(!t){$('routeStatus').className='status warn';$('routeStatus').textContent='Mapbox公開トークンを保存してください。';return}try{$('routeStatus').className='status';$('routeStatus').textContent='通行止めを強制除外して計算中…';const [a,b]=await Promise.all([geocode($('start').value+' 千葉県',t),geocode($('goal').value+' 千葉県',t)]);if(!a||!b)throw new Error('出発地または目的地が見つかりません');const gs=[];let expts=[];for(const c of closures){const g=await closureGeometry(c,t);gs.push(g);if(g.line?.length){const n=7;for(let k=1;k<n;k++){const idx=Math.floor(g.line.length*k/n);expts.push(g.line[Math.min(idx,g.line.length-1)])}}else expts.push(...(g.pts||[]))}const uniq=[];for(const p of expts){if(!uniq.some(q=>Math.abs(q[0]-p[0])<.00025&&Math.abs(q[1]-p[1])<.00025))uniq.push(p)}const exclude=uniq.slice(0,50).map(p=>`point(${p[0].toFixed(6)} ${p[1].toFixed(6)})`).join(',');const par={access_token:t,geometries:'geojson',overview:'full',alternatives:'true',steps:'false',language:'ja'};if(exclude)par.exclude=exclude;const u='https://api.mapbox.com/directions/v5/mapbox/driving-traffic/'+a.join(',')+';'+b.join(',')+'?'+new URLSearchParams(par);const r=await fetch(u);const j=await r.json();if(!r.ok||!j.routes?.length)throw new Error(j.message||'走行可能なルートが見つかりません');let chosen=null;for(const rt of j.routes){if(!routeHits(rt.geometry.coordinates,gs)){chosen=rt;break}}if(!chosen)throw new Error('候補ルートが通行止め区間に接触します。安全なルートを表示できません。');routeLayer.clearLayers();const latlng=chosen.geometry.coordinates.map(p=>[p[1],p[0]]);const ln=L.polyline(latlng,{color:'#1769aa',weight:7,opacity:.9}).addTo(routeLayer);map.fitBounds(ln.getBounds(),{padding:[30,30]});$('routeStatus').className='status ok';$('routeStatus').textContent='通行止めに接触しない候補ルートを表示しました。';$('routeInfo').innerHTML=`<b>${(chosen.distance/1000).toFixed(1)} km / 約 ${Math.round(chosen.duration/60)} 分</b><br>規制区間を強制除外し、返却後も接触チェック済み。`}catch(e){$('routeStatus').className='status warn';$('routeStatus').textContent=e.message}}
loadClosures();setInterval(()=>loadClosures(true),5*60*1000);
</script></body></html>
