<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>房総 通行止め自動回避ナビ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--bg:#f4f2ec;--panel:#fff;--ink:#222;--muted:#6b6b6b;--line:#ddd8cf;--accent:#1769aa;--danger:#c62828;--ok:#2e7d32;--warn:#9a5b00;--hw:#7b1fa2}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink)}.app{display:grid;grid-template-columns:410px 1fr;height:100vh}.side{background:#fff;border-right:1px solid var(--line);padding:18px;overflow:auto}.map{height:100vh}h1{font-size:21px;margin:0 0 5px}.sub,.note{font-size:12px;color:var(--muted);line-height:1.55}.sub{margin-bottom:14px}.section{border-top:1px solid var(--line);margin-top:14px;padding-top:14px}label{display:block;font-size:12px;font-weight:700;margin:11px 0 5px}input,button{font:inherit}input{width:100%;padding:10px;border:1px solid #cfcac1;border-radius:8px}button{border:0;border-radius:8px;padding:10px 12px;font-weight:700;cursor:pointer}.primary{background:var(--accent);color:#fff;width:100%;margin-top:11px}.secondary{background:#ece9e2}.status{margin-top:10px;padding:10px;border-radius:8px;background:#f4f6f8;font-size:12px;line-height:1.5}.status.ok{background:#eaf6ec}.status.warn{background:#fff4e5}.kpi{display:flex;gap:8px;margin:8px 0}.kpi>div{flex:1;border:1px solid var(--line);padding:8px;border-radius:9px;background:#fafafa}.kpi b{display:block;font-size:18px}.kpi span{font-size:10px;color:var(--muted)}.card{border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0}.card strong{display:block;font-size:13px}.card small{display:block;color:var(--muted);line-height:1.45}.badge{display:inline-block;padding:3px 6px;border-radius:999px;font-size:10px;font-weight:700;margin-bottom:6px}.red{background:#fde5e5;color:#a51919}.purple{background:#f0e4f4;color:#6a1b75}.gray{background:#eee;color:#555}.routeInfo{font-size:13px;line-height:1.6;margin-top:10px}.tokenbox{background:#fff7e6;border:1px solid #e9c46a;border-radius:10px;padding:10px;margin-top:10px}.tokenbox input{margin-top:5px}.smallbtn{font-size:11px;padding:6px 8px}.legend{font-size:11px;line-height:1.5;margin-top:8px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}.dot.red{background:#c62828}.dot.purple{background:#7b1fa2}.seg{display:inline-block;width:22px;height:5px;background:#111;border-radius:3px;margin:0 5px 2px 0}@media(max-width:800px){.app{grid-template-columns:1fr;grid-template-rows:auto 62vh;height:auto}.side{border-right:0;border-bottom:1px solid var(--line)}.map{height:62vh}}
</style></head><body><div class="app"><aside class="side"><h1>房総 通行止め自動回避ナビ</h1><div class="sub">公式情報から一般道と高速道路の通行止めを自動収集。位置が確定できない規制を、推測の赤線で描かない設計に変更しました。</div>
<div id="tokenSetup" class="tokenbox"><strong>Mapbox 公開トークン</strong><div class="note">このPCでは保存済みなら再入力不要です。</div><input id="token" placeholder="pk. で始まる公開トークン"><button class="secondary" style="width:100%;margin-top:8px" onclick="saveToken()">保存</button></div>
<div id="updateStatus" class="status">規制情報を読み込み中…</div><div class="kpi"><div><b id="generalCount">—</b><span>一般道</span></div><div><b id="highwayCount">—</b><span>高速道路</span></div><div><b id="updatedAt">—</b><span>更新</span></div></div><button class="secondary" style="width:100%" onclick="loadClosures(true)">↻ 最新データを再読込</button>
<div class="legend"><span class="seg"></span>区間特定できた通行止め　 <span class="dot red"></span>地点のみ特定　 <span class="dot purple"></span>高速規制<br>※黒線は始終点から道路ネットワークに沿って取得した区間です。位置を確定できないものは推測線を描きません。</div>
<div class="section"><label>出発地</label><input id="start" value="木更津駅"><label>目的地</label><input id="goal" value="館山駅"><button class="primary" onclick="routeNow()">通行止めを避けてルート検索</button><div id="routeStatus" class="status">出発地と目的地を入力してください。</div><div id="routeInfo" class="routeInfo"></div></div>
<div class="section"><strong>現在の通行止め</strong><div id="closureList"></div></div></aside><div id="map" class="map"></div></div>
<script>
const BOUNDS=[[34.88,139.72],[35.68,140.35]];const map=L.map('map');map.fitBounds(BOUNDS,{padding:[10,10]});L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
let closures=[],markers=L.layerGroup().addTo(map),routeLayer=L.layerGroup().addTo(map);const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function token(){return localStorage.getItem('boso_mapbox_token')||''}function saveToken(){const t=$('token').value.trim();if(!t.startsWith('pk.')){alert('pk. で始まる公開トークンを貼り付けてください');return}localStorage.setItem('boso_mapbox_token',t);$('routeStatus').className='status ok';$('routeStatus').textContent='Mapbox公開トークンを保存しました。';resolveAndRender()}$('token').value=token();
function cache(){try{return JSON.parse(localStorage.getItem('boso_closure_points')||'{}')}catch(e){return {}}}function saveCache(c){localStorage.setItem('boso_closure_points',JSON.stringify(c))}
async function loadClosures(force=false){$('updateStatus').className='status';$('updateStatus').textContent='最新の規制情報を読み込み中…';try{const r=await fetch('closures.json'+(force?'?t='+Date.now():''),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();closures=j.closures||[];$('generalCount').textContent=j.general_count??closures.filter(x=>x.kind!=='highway').length;$('highwayCount').textContent=j.highway_count??closures.filter(x=>x.kind==='highway').length;$('updatedAt').textContent=new Date(j.generated_at).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});renderList();$('updateStatus').className='status ok';$('updateStatus').textContent='公式サイトから取得した現在の規制を表示しています。';await resolveAndRender()}catch(e){$('updateStatus').className='status warn';$('updateStatus').textContent='規制データを取得できませんでした: '+e.message}}
function renderList(){const box=$('closureList');box.innerHTML='';if(!closures.length){box.innerHTML='<div class="card">現在取得できた規制はありません。</div>';return}closures.forEach(c=>{const d=document.createElement('div');d.className='card';const cls=c.kind==='highway'?'purple':'red';const label=c.kind==='highway'?'高速通行止め':'一般道通行止め';d.innerHTML=`<span class="badge ${cls}">${label}</span><strong>${esc(c.title)}</strong><small>${esc(c.description||c.location||'')}<br>${esc(c.source_name||'公式情報')}<br><span id="loc-${c.id}">位置確認中</span></small>`;box.appendChild(d)})}
async function geocode(q,t){if(!q)return null;const u='https://api.mapbox.com/search/geocode/v6/forward?'+new URLSearchParams({q:q,country:'jp',language:'ja',limit:'1',access_token:t});const r=await fetch(u);if(!r.ok)return null;const j=await r.json();return j.features?.[0]?.geometry?.coordinates||null}
async function networkSection(a,b,t){try{const u='https://api.mapbox.com/directions/v5/mapbox/driving/'+a.join(',')+';'+b.join(',')+'?'+new URLSearchParams({access_token:t,geometries:'geojson',overview:'full',steps:'false'});const r=await fetch(u);if(!r.ok)return null;const j=await r.json();return j.routes?.[0]?.geometry?.coordinates||null}catch(e){return null}}
async function resolveClosure(c,t,cc){if(cc[c.id])return cc[c.id];let out={points:[],line:null};if(c.kind==='highway'&&Array.isArray(c.endpoints)){const ep=[];for(const name of c.endpoints){const p=await geocode(name+' '+(c.road||'')+' 千葉県',t);if(p)ep.push(p)}if(ep.length===2){out.points=ep;out.line=await networkSection(ep[0],ep[1],t)}}else if(Array.isArray(c.endpoints)){const ep=[];for(const name of c.endpoints){const p=await geocode(name+' '+(c.road||'')+' 千葉県',t);if(p)ep.push(p)}if(ep.length===2){out.points=ep;out.line=await networkSection(ep[0],ep[1],t)}}else if(c.point){out.points=[c.point]}else if(c.query){const p=await geocode(c.query,t);if(p)out.points=[p]}if(out.points.length){cc[c.id]=out;saveCache(cc)}return out}
async function resolveAndRender(){markers.clearLayers();const t=token();const cc=cache();if(!t){closures.forEach(c=>{const el=$('loc-'+c.id);if(el)el.textContent=c.point?'代表点あり':'Mapboxトークン保存後に位置確認'});return}let done=0;for(const c of closures.slice(0,80)){const r=await resolveClosure(c,t,cc);const el=$('loc-'+c.id);if(el)el.textContent=r.line?'区間を線表示':(r.points.length?'地点を表示':'位置未特定（一覧表示のみ）');if(r.line){L.polyline(r.line.map(p=>[p[1],p[0]]),{color:'#111',weight:c.kind==='highway'?8:7,opacity:.9}).bindPopup(`<b>${esc(c.title)}</b><br>${esc(c.description||'')}<br><small>${esc(c.source_name||'')}</small>`).addTo(markers)}else{for(const p of r.points){L.circleMarker([p[1],p[0]],{radius:7,color:c.kind==='highway'?'#7b1fa2':'#c62828',fillColor:c.kind==='highway'?'#7b1fa2':'#c62828',fillOpacity:.85,weight:2}).bindPopup(`<b>${esc(c.title)}</b><br>${esc(c.description||'')}<br><small>${esc(c.source_name||'')}</small>`).addTo(markers)}}done++;if(done%6===0)await new Promise(r=>setTimeout(r,120))}}
async function routeNow(){const t=token();if(!t){$('routeStatus').className='status warn';$('routeStatus').textContent='Mapbox公開トークンを保存してください。';return}$('routeStatus').className='status';$('routeStatus').textContent='公式通行止めを地図上で確認してルート計算中…';$('routeInfo').innerHTML='';try{const [a,b]=await Promise.all([geocode($('start').value+' 千葉県',t),geocode($('goal').value+' 千葉県',t)]);if(!a||!b)throw new Error('出発地または目的地が見つかりません');const cc=cache();let pts=[];for(const c of closures.slice(0,80)){const r=await resolveClosure(c,t,cc);if(r.line&&r.line.length){const step=Math.max(1,Math.floor(r.line.length/5));for(let i=0;i<r.line.length;i+=step)pts.push(r.line[i]);pts.push(r.line[r.line.length-1])}else pts.push(...r.points)}// 区間線は数点サンプリングして強制除外。重複を減らし最大50点
const uniq=[];for(const p of pts){if(!uniq.some(q=>Math.abs(q[0]-p[0])<0.0002&&Math.abs(q[1]-p[1])<0.0002))uniq.push(p)}const ex=uniq.slice(0,50).map(p=>`point(${p[0].toFixed(6)} ${p[1].toFixed(6)})`).join(',');const params={access_token:t,geometries:'geojson',overview:'full',steps:'false',alternatives:'true',language:'ja',notifications:'all'};if(ex)params.exclude=ex;const url='https://api.mapbox.com/directions/v5/mapbox/driving-traffic/'+a.join(',')+';'+b.join(',')+'?'+new URLSearchParams(params);const r=await fetch(url);let j={};try{j=await r.json()}catch(e){}if(!r.ok)throw new Error('Mapboxルート計算に失敗 '+r.status+(j.message?'：'+j.message:''));if(!j.routes?.length)throw new Error('走行可能なルートが見つかりません');const route=j.routes[0];routeLayer.clearLayers();const latlngs=route.geometry.coordinates.map(p=>[p[1],p[0]]);const line=L.polyline(latlngs,{color:'#1769aa',weight:7,opacity:.9}).addTo(routeLayer);map.fitBounds(line.getBounds(),{padding:[30,30]});const km=route.distance/1000,mins=Math.round(route.duration/60);$('routeInfo').innerHTML=`<b>${km.toFixed(1)} km / 約 ${mins} 分</b><br>公式通行止め ${Math.min(uniq.length,50)}地点を強制除外＋Mapbox交通情報`;$('routeStatus').className='status ok';$('routeStatus').textContent='通行止め回避ルートを表示しました。'}catch(e){$('routeStatus').className='status warn';$('routeStatus').textContent=e.message}}
loadClosures();setInterval(()=>loadClosures(true),5*60*1000);
</script></body></html>
