<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>房総 通行止め自動回避ナビ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--accent:#1769aa;--line:#ddd7cc;--muted:#746f68;--paper:#f8f6f1}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:#222;background:var(--paper)}.app{display:grid;grid-template-columns:370px 1fr;height:100vh}.side{overflow:auto;padding:18px;background:#fff;border-right:1px solid var(--line)}.map{height:100vh}h1{font-size:20px;margin:0 0 5px}.sub{font-size:12px;line-height:1.6;color:var(--muted)}.section{margin-top:16px;padding-top:15px;border-top:1px solid #eee}label{font-size:12px;font-weight:700;display:block;margin:8px 0 4px}input{width:100%;padding:10px;border:1px solid #bbb;border-radius:8px}button{border:0;border-radius:8px;padding:10px 12px;cursor:pointer;font-weight:700}.primary{background:var(--accent);color:#fff;width:100%;margin-top:11px}.secondary{background:#ece9e2}.status{margin-top:10px;padding:10px;border-radius:8px;background:#f4f6f8;font-size:12px;line-height:1.5}.status.ok{background:#eaf6ec}.status.warn{background:#fff4e5}.status.bad{background:#fdeaea}.kpi{display:flex;gap:8px;margin:8px 0}.kpi>div{flex:1;border:1px solid var(--line);padding:8px;border-radius:9px;background:#fafafa}.kpi b{display:block;font-size:18px}.kpi span{font-size:10px;color:var(--muted)}.card{border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0}.card strong{display:block;font-size:13px}.card small{display:block;color:var(--muted);line-height:1.45}.badge{display:inline-block;padding:3px 6px;border-radius:999px;font-size:10px;font-weight:700;margin-bottom:6px}.red{background:#fde5e5;color:#a51919}.purple{background:#f0e4f4;color:#6a1b75}.routeInfo{font-size:13px;line-height:1.6;margin-top:10px}.tokenbox{background:#fff7e6;border:1px solid #e9c46a;border-radius:10px;padding:10px;margin-top:10px}.legend{font-size:11px;line-height:1.6;margin-top:8px}.seg{display:inline-block;width:24px;height:7px;background:#111;border-radius:4px;margin:0 5px 1px 0}.xmark{display:inline-block;font-size:17px;font-weight:900;color:#111;line-height:10px;margin-right:5px}.closure-x{font-weight:900;font-size:25px;color:#111;text-shadow:0 0 3px #fff,0 0 3px #fff}.leaflet-div-icon{background:transparent;border:0}.source{color:#777;text-decoration:none}.source:hover{text-decoration:underline}@media(max-width:800px){.app{grid-template-columns:1fr;grid-template-rows:auto 62vh;height:auto}.side{border-right:0;border-bottom:1px solid var(--line)}.map{height:62vh}}
</style></head><body><div class="app"><aside class="side"><h1>房総 通行止め自動回避ナビ</h1><div class="sub">最優先は「規制を避けること」。Mapboxに規制地点を除外指定し、返ってきたルートも規制に触れていないか再検査します。</div>
<div id="tokenSetup" class="tokenbox"><strong>Mapbox 公開トークン</strong><div class="sub">このPCでは一度保存すれば再入力不要です。</div><input id="token" placeholder="pk. で始まる公開トークン"><button class="secondary" style="width:100%;margin-top:8px" onclick="saveToken()">保存</button></div>
<div id="updateStatus" class="status">規制情報を読み込み中…</div><div class="kpi"><div><b id="generalCount">—</b><span>一般道</span></div><div><b id="highwayCount">—</b><span>高速道路</span></div><div><b id="updatedAt">—</b><span>更新</span></div></div><button class="secondary" style="width:100%" onclick="loadClosures(true)">↻ 最新データを再読込</button>
<div class="legend"><span class="seg"></span>区間が明示された通行止め　 <span class="xmark">×</span>地点規制<br>黒線は道路ネットワーク沿い。区間不明を適当な線で描くことはしません。</div>
<div class="section"><label>出発地</label><input id="start" value="木更津駅"><label>目的地</label><input id="goal" value="館山駅"><button class="primary" onclick="routeNow()">通行止めを避けてルート検索</button><div id="routeStatus" class="status">出発地と目的地を入力してください。</div><div id="routeInfo" class="routeInfo"></div></div>
<div class="section"><strong>現在の通行止め</strong><div id="closureList"></div></div></aside><div id="map" class="map"></div></div>
<script>
const BOUNDS=[[34.88,139.72],[35.68,140.35]], map=L.map('map');map.fitBounds(BOUNDS,{padding:[10,10]});L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
let closures=[],resolved={},markers=L.layerGroup().addTo(map),routeLayer=L.layerGroup().addTo(map);const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function token(){return localStorage.getItem('boso_mapbox_token')||''}function saveToken(){const t=$('token').value.trim();if(!t.startsWith('pk.')){alert('pk. で始まる公開トークンを貼り付けてください');return}localStorage.setItem('boso_mapbox_token',t);$('routeStatus').className='status ok';$('routeStatus').textContent='Mapbox公開トークンを保存しました。';resolveAndRender()}$('token').value=token();
function cache(){try{return JSON.parse(localStorage.getItem('boso_closure_v5')||'{}')}catch(e){return {}}}function saveCache(c){localStorage.setItem('boso_closure_v5',JSON.stringify(c))}
async function loadClosures(force=false){$('updateStatus').className='status';$('updateStatus').textContent='最新の規制情報を読み込み中…';try{const r=await fetch('closures.json'+(force?'?t='+Date.now():''),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();closures=j.closures||[];$('generalCount').textContent=j.general_count??closures.filter(x=>x.kind!=='highway').length;$('highwayCount').textContent=j.highway_count??closures.filter(x=>x.kind==='highway').length;$('updatedAt').textContent=new Date(j.generated_at).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});renderList();$('updateStatus').className='status ok';$('updateStatus').textContent='現在実施中として取得できた公式規制を表示しています。';await resolveAndRender()}catch(e){$('updateStatus').className='status warn';$('updateStatus').textContent='規制データを取得できませんでした: '+e.message}}
function renderList(){const box=$('closureList');box.innerHTML='';if(!closures.length){box.innerHTML='<div class="card">現在取得できた規制はありません。</div>';return}closures.forEach(c=>{const d=document.createElement('div');d.className='card';const cls=c.kind==='highway'?'purple':'red',label=c.kind==='highway'?'高速通行止め':'一般道通行止め';d.innerHTML=`<span class="badge ${cls}">${label}</span><strong>${esc(c.title)}</strong><small>${esc(c.description||c.location||'')}<br><a class="source" target="_blank" rel="noopener" href="${esc(c.source)}">${esc(c.source_name||'公式情報')}</a><br><span id="loc-${c.id}">位置確認中</span></small>`;box.appendChild(d)})}
async function geocode(q,t){if(!q)return null;const u='https://api.mapbox.com/search/geocode/v6/forward?'+new URLSearchParams({q:q,country:'jp',language:'ja',limit:'1',access_token:t});const r=await fetch(u);if(!r.ok)return null;const j=await r.json();return j.features?.[0]?.geometry?.coordinates||null}
async function networkSection(a,b,t,motorway){try{const p={access_token:t,geometries:'geojson',overview:'full',steps:'false'};if(!motorway)p.exclude='motorway';const u='https://api.mapbox.com/directions/v5/mapbox/driving/'+a.join(',')+';'+b.join(',')+'?'+new URLSearchParams(p);const r=await fetch(u);if(!r.ok)return null;const j=await r.json();return j.routes?.[0]?.geometry?.coordinates||null}catch(e){return null}}
async function resolveClosure(c,t,cc){if(cc[c.id])return cc[c.id];let out={points:[],line:null};if(c.segment?.queries?.length===2){const ep=[];for(const q of c.segment.queries){const p=await geocode(q+' 千葉県',t);if(p)ep.push(p)}if(ep.length===2){out.points=ep;out.line=await networkSection(ep[0],ep[1],t,!!c.segment.motorway)}}if(!out.points.length&&c.query){const p=await geocode(c.query,t);if(p)out.points=[p]}if(out.points.length){cc[c.id]=out;saveCache(cc)}return out}
function xIcon(){return L.divIcon({className:'',html:'<div class="closure-x">×</div>',iconSize:[24,24],iconAnchor:[12,15]})}
async function resolveAndRender(){markers.clearLayers();resolved={};const t=token(),cc=cache();if(!t){closures.forEach(c=>{const el=$('loc-'+c.id);if(el)el.textContent='Mapboxトークン保存後に位置確認'});return}let done=0;for(const c of closures.slice(0,100)){const r=await resolveClosure(c,t,cc);resolved[c.id]=r;const el=$('loc-'+c.id);if(el)el.textContent=r.line?'道路沿いの区間線':(r.points.length?'地点規制（×表示）':'位置未特定（一覧のみ）');const pop=`<b>${esc(c.title)}</b><br>${esc(c.description||'')}<br><small>${esc(c.source_name||'')}</small>`;if(r.line){L.polyline(r.line.map(p=>[p[1],p[0]]),{color:'#fff',weight:11,opacity:.95}).addTo(markers);L.polyline(r.line.map(p=>[p[1],p[0]]),{color:'#111',weight:7,opacity:.95}).bindPopup(pop).addTo(markers)}else if(r.points.length){const p=r.points[0];L.marker([p[1],p[0]],{icon:xIcon()}).bindPopup(pop).addTo(markers)}done++;if(done%6===0)await new Promise(r=>setTimeout(r,120))}}
function d2(a,b){const x=(a[0]-b[0])*Math.cos((a[1]+b[1])*Math.PI/360),y=a[1]-b[1];return x*x+y*y}function corridorScore(p,a,b){const vx=b[0]-a[0],vy=b[1]-a[1],wx=p[0]-a[0],wy=p[1]-a[1],vv=vx*vx+vy*vy;if(!vv)return d2(p,a);let t=(wx*vx+wy*vy)/vv;t=Math.max(0,Math.min(1,t));return d2(p,[a[0]+t*vx,a[1]+t*vy])}
function sampleResolved(r){if(r.line?.length){const n=Math.min(6,Math.max(3,Math.ceil(r.line.length/80))),pts=[];for(let i=0;i<n;i++)pts.push(r.line[Math.round(i*(r.line.length-1)/(n-1))]);return pts}return r.points||[]}
function distPointSegMeters(p,a,b){const lat=(p[1]+a[1]+b[1])/3*Math.PI/180, sx=111320*Math.cos(lat),sy=110540;const px=p[0]*sx,py=p[1]*sy,ax=a[0]*sx,ay=a[1]*sy,bx=b[0]*sx,by=b[1]*sy,vx=bx-ax,vy=by-ay,wx=px-ax,wy=py-ay,vv=vx*vx+vy*vy;let t=vv?((wx*vx+wy*vy)/vv):0;t=Math.max(0,Math.min(1,t));const dx=px-(ax+t*vx),dy=py-(ay+t*vy);return Math.hypot(dx,dy)}
function routeTouches(routeCoords,closure){const r=resolved[closure.id];if(!r)return false;const test=sampleResolved(r);for(const p of test){for(let i=1;i<routeCoords.length;i++){if(distPointSegMeters(p,routeCoords[i-1],routeCoords[i])<90)return true}}return false}
async function routeNow(){const t=token();if(!t){$('routeStatus').className='status warn';$('routeStatus').textContent='Mapbox公開トークンを保存してください。';return}$('routeStatus').className='status';$('routeStatus').textContent='規制地点を除外して候補ルートを計算・検査中…';$('routeInfo').innerHTML='';try{const [a,b]=await Promise.all([geocode($('start').value+' 千葉県',t),geocode($('goal').value+' 千葉県',t)]);if(!a||!b)throw new Error('出発地または目的地が見つかりません');const ranked=[];for(const c of closures){const r=resolved[c.id]||await resolveClosure(c,t,cache());resolved[c.id]=r;const pts=sampleResolved(r);if(!pts.length)continue;ranked.push({c,pts,score:Math.min(...pts.map(p=>corridorScore(p,a,b)))})}ranked.sort((x,y)=>x.score-y.score);const expts=[];for(const z of ranked){for(const p of z.pts){if(!expts.some(q=>Math.abs(q[0]-p[0])<0.00015&&Math.abs(q[1]-p[1])<0.00015))expts.push(p);if(expts.length>=50)break}if(expts.length>=50)break}const ex=expts.map(p=>`point(${p[0].toFixed(6)} ${p[1].toFixed(6)})`).join(',');const params={access_token:t,geometries:'geojson',overview:'full',steps:'false',alternatives:'true',language:'ja',notifications:'all',depart_at:'now'};if(ex)params.exclude=ex;const url='https://api.mapbox.com/directions/v5/mapbox/driving-traffic/'+a.join(',')+';'+b.join(',')+'?'+new URLSearchParams(params);const rr=await fetch(url);const j=await rr.json();if(!rr.ok)throw new Error('Mapboxルート計算に失敗 '+rr.status+(j.message?'：'+j.message:''));if(!j.routes?.length)throw new Error('走行可能なルートが見つかりません');let chosen=null,blocked=[];for(const rt of j.routes){const coords=rt.geometry.coordinates;const hit=ranked.filter(z=>routeTouches(coords,z.c)).map(z=>z.c);if(!hit.length){chosen=rt;break}if(!blocked.length)blocked=hit}if(!chosen){$('routeStatus').className='status bad';$('routeStatus').textContent='候補ルートが通行止めに接触しました。安全なルートとして表示しません。';$('routeInfo').innerHTML=blocked.length?'接触規制：'+blocked.slice(0,5).map(x=>esc(x.title)).join('<br>'):'';routeLayer.clearLayers();return}routeLayer.clearLayers();const latlngs=chosen.geometry.coordinates.map(p=>[p[1],p[0]]);const line=L.polyline(latlngs,{color:'#1769aa',weight:7,opacity:.9}).addTo(routeLayer);map.fitBounds(line.getBounds(),{padding:[30,30]});const km=chosen.distance/1000,mins=Math.round(chosen.duration/60);$('routeInfo').innerHTML=`<b>${km.toFixed(1)} km / 約 ${mins} 分</b><br>近い規制から最大 ${expts.length} 地点を強制除外し、返却ルートも再検査済み。`;$('routeStatus').className='status ok';$('routeStatus').textContent='通行止めに接触しない候補ルートを表示しました。'}catch(e){$('routeStatus').className='status warn';$('routeStatus').textContent=e.message}}
loadClosures();setInterval(()=>loadClosures(true),5*60*1000);
</script></body></html>
